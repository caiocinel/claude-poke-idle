services:
  pokeidle:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./data:/app/data
    environment:
      # The Client ID of the GitHub OAuth App, with Device Flow enabled
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
