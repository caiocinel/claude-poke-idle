services:
  pokeidle:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./data:/app/data
    environment:
      SMTP_HOST: ${SMTP_HOST:-172.17.0.1}
      SMTP_PORT: ${SMTP_PORT:-25}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-pokeidle@smtp.caiocinel.com}
    extra_hosts:
      - "host.docker.internal:host-gateway"
